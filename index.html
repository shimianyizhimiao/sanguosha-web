<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三國殺 · 網頁版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23120f0b'/%3E%3Crect x='4' y='4' width='56' height='56' rx='9' fill='none' stroke='%23d9b46a' stroke-width='2'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23d9b46a' font-family='serif'%3E%E6%AE%BA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<!-- 連線對戰用：PeerJS 直接放本機，不依賴 CDN（學校網路常擋 CDN） -->
<script src="js/vendor/peerjs.min.js"></script>
</head>
<body>

<!-- 背景音樂播放器（固定在畫面外，主頁與對局都可用） -->
<div id="bgm" aria-hidden="true"></div>

<!-- ================= 大廳 ================= -->
<div id="lobby">
  <button id="btnBgmLobby" class="act" title="背景音樂">🎵 音樂</button>
  <div class="lobby-inner">
    <div class="brand">
      <h1>三國殺</h1>
      <p>SAN GUO SHA · WEB</p>
    </div>

    <div class="grid">
      <div class="block">
        <h3>模式</h3>
        <div class="opts" id="modeOpts"></div>
      </div>
      <div class="block">
        <h3>武將編制</h3>
        <div class="opts" id="genOpts">
          <button class="opt on" data-double="0">單將</button>
          <button class="opt" data-double="1">雙將</button>
        </div>
      </div>
      <div class="block">
        <h3>牌庫</h3>
        <div class="opts" id="packOpts"></div>
      </div>
      <div class="block">
        <h3>武將包</h3>
        <div class="opts" id="gpackOpts"></div>
      </div>
    </div>

    <div style="display:flex;justify-content:center;margin-top:14px">
      <button class="opt" id="btnEditor">＋ 自定義武將編輯器</button>
    </div>

    <div class="netbox">
      <div class="netbox-title">線上連線（不同裝置一起玩）</div>
      <div class="netbox-row">
        <button class="opt" id="btnNetHost">建立房間</button>
        <input id="netCode" class="net-input" maxlength="6" placeholder="4 位房號" autocomplete="off">
        <button class="opt" id="btnNetJoin">加入房間</button>
      </div>
      <div id="netPanel" class="net-panel hidden"></div>
    </div>

    <div class="start-row">
      <button class="btn-primary" id="btnStart">開 始 對 局</button>
    </div>
    <div class="foot" id="lobbyFoot"></div>
  </div>
</div>

<!-- ================= 選將 ================= -->
<div id="pick" class="hidden">
  <h2 id="pickTitle">選 擇 你 的 武 將</h2>
  <div class="pick-cards" id="pickCards"></div>
  <div class="pick-hint" id="pickHint"></div>
</div>

<!-- ================= 對局 ================= -->
<div id="table" class="hidden">
  <div id="board">
    <canvas id="fx"></canvas>
    <div id="seats"></div>
    <div id="roleBar"></div>
    <div id="deckInfo"></div>
    <div id="center">
      <div class="phase" id="phaseLabel"></div>
      <div class="prompt" id="promptLabel"></div>
      <div id="playArea"></div>
    </div>
  </div>
  <div id="log"></div>
  <div id="bottom">
    <div id="topbar">
      <button id="btnSound" class="act">🔊 音效開</button>
      <button id="btnSpeed" class="act">速度：正常</button>
      <button id="btnLog" class="act">日誌</button>
      <button id="btnBgm" class="act">🎵 BGM</button>
    </div>
    <div id="myequips"></div>
    <div id="actions"></div>
    <div id="hand"></div>
    <div id="handinfo"></div>
  </div>
</div>

<div id="editor" class="hidden">
  <div class="editor-box">
    <h2>自 定 義 武 將</h2>
    <div class="erow">
      <label>名稱<input id="edName" maxlength="8" placeholder="例：關銀屏"></label>
      <label>勢力<select id="edKingdom"><option>蜀</option><option>魏</option><option>吳</option><option>群</option><option>神</option></select></label>
      <label>體力<select id="edHp"><option>3</option><option selected>4</option><option>5</option></select></label>
      <label>性別<select id="edGender"><option value="male">男</option><option value="female">女</option></select></label>
    </div>
    <div class="ehint">技能（最多 3 個，可混搭現有技能）</div>
    <div class="eskills" id="edSkills"></div>
    <div class="erow" style="justify-content:space-between">
      <span class="ehint" id="edSaved"></span>
      <span>
        <button class="act" id="edExport">匯出 JSON</button>
        <button class="act" id="edImport">匯入 JSON</button>
        <button class="act ok" id="edSave">儲存武將</button>
        <button class="act cancel" id="edClose">關閉</button>
      </span>
    </div>
    <div class="elist" id="edList"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ================= 結算 ================= -->
<div id="result" class="hidden">
  <div class="box">
    <h2 id="resTitle">勝利</h2>
    <p id="resSub"></p>
    <div class="roles" id="resRoles"></div>
    <button class="btn-primary" id="btnAgain">再 來 一 局</button>
  </div>
</div>

<script src="js/cards.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/voice.js"></script>
<script src="js/engine.js"></script>
<script src="js/generals.js"></script>
<script src="js/generals-extra.js"></script>
<script src="js/generals-packs.js"></script>
<script src="js/skills-windfire.js"></script>
<script src="js/ai.js"></script>
<script src="js/setup.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/netplay.js"></script>
<script>
  // 大廳的連線按鈕
  (function () {
    const host = document.getElementById('btnNetHost');
    const join = document.getElementById('btnNetJoin');
    const code = document.getElementById('netCode');
    if (host) host.onclick = () => { if (window.SGS_NETPLAY) window.SGS_NETPLAY.createRoom(); };
    if (join) join.onclick = () => {
      const v = (code.value || '').trim().toUpperCase();
      if (v.length < 3) { if (window.__sgsUI) window.__sgsUI.net.toast('請輸入房號'); return; }
      if (window.SGS_NETPLAY) window.SGS_NETPLAY.joinRoom(v);
    };
  })();
</script>
<div id="sheet" class="hidden"><div class="sheet-box">
  <div class="sheet-head"><span id="sheetTitle"></span><button id="sheetClose">關閉</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div></div>

</body>
</html>
